services:
  nats:
    image: nats:alpine
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--trace"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=trequila
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Maps your local init.sql to run automatically on startup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - DB_URL=postgres://postgres:password@db:5432/trequila?sslmode=disable
    depends_on:
      nats:
        condition: service_healthy
      db:
        condition: service_healthy

  planner:
    build:
      context: .
      dockerfile: Dockerfile.planner
    environment:
      - NATS_URL=nats://nats:4222
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      nats:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  imager:
    build:
      context: .
      dockerfile: Dockerfile.imager
    environment:
      - NATS_URL=nats://nats:4222
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - REDIS_ADDR=redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  places:
    build:
      context: .
      dockerfile: Dockerfile.places
    environment:
      - NATS_URL=nats://nats:4222
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}
    depends_on:
      nats:
        condition: service_healthy

volumes:
  postgres_data: